debug: false # Debug Logs will show on console
holograms: false # Set to true to enable holograms above the Spawners
hologram-update-ticks: 40

convert-natural-spawners: true # If set to true all natural generated spawners will be converted into astralSpawners

generation:
  interval-ticks: 200
  require-player-nearby: false # If set to false spawners will not need a player to generate loot
  activation-range: 24
  offline-generation: false
  loot-limit: -1

stacking:
  max-stack: 2000 # Max spawners 
  merge-on-place: true 
  same-type-only: true # Please do not change this unless you know what you are doing

breaking:
  enabled: true # If set to false spawners won't be breakable
  silk-touch-required: true
  drop-chance: 100
  direct-to-inventory: true
  explosion-protection: true

storage:
  max-slots: 45
  max-exp: 50000
  auto-sell: false

economy:
  enabled: true
  currency-symbol: "$"

performance:
  async-save: true
  save-interval-seconds: 300
  max-spawners-per-chunk: 32 

bedrock:
  disable-holograms-for-bedrock: true # Should holograms work for bedrock clients?
