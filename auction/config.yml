currency-symbol: "$"
Use-shards: true # use shards currency on auction ( players can sell either for money or for shards)

auction:
  duration-hours: 24 # During before the item expire
  fee-percentage: 0
  minimum-price: 1.0
  maximum-price: 1000000000.0
  expire-check-interval: 60
  max-listings-default: 5

blacklist-items:
  - BEDROCK
  - BARRIER

storage:
  auto-save-seconds: 120

chat-input:
  SignAPI: true
  ChatAPI: false

sign-gui:
  price:
    - ""
    - "↑↑↑↑↑↑↑↑↑↑↑↑↑"
    - "   Price    "
    - "             "
  search:
    - ""
    - "↑↑↑↑↑↑↑↑↑↑↑↑↑"
    - "   Search   "
    - "             "

economy:
  abbreviations:
    enabled: true

sounds:
  gui-click:
    enabled: true
    sound: UI_BUTTON_CLICK
    volume: 1.0
    pitch: 1.0
  gui-open:
    enabled: true
    sound: BLOCK_CHEST_OPEN
    volume: 0.6
    pitch: 1.2
  error:
    enabled: true
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 1.0
  sold:
    enabled: true
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.0
  bought:
    enabled: true
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.2
