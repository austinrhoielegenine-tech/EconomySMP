name: One-time NovaCore rename
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/one-time-novacore-rename.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace all legacy branding and rename Java package
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rename the Java package directory and main class source file.
          if [ -d src/main/java/com/austynzdevv/economysmp ]; then
            git mv src/main/java/com/austynzdevv/economysmp src/main/java/com/austynzdevv/novacore
          fi
          if [ -f src/main/java/com/austynzdevv/novacore/EconomySMP.java ]; then
            git mv src/main/java/com/austynzdevv/novacore/EconomySMP.java src/main/java/com/austynzdevv/novacore/NovaCore.java
          fi

          # Replace case-sensitive branding and lowercase package/permission/placeholder namespace
          # in every tracked text file.
          git grep -Il -e 'EconomySMP' -e 'economysmp' -- . ':!.git' | while IFS= read -r file; do
            sed -i 's/EconomySMP/NovaCore/g; s/economysmp/novacore/g' "$file"
          done

          # Also rename any remaining tracked paths containing the old branding.
          while IFS= read -r -d '' file; do
            new="${file//EconomySMP/NovaCore}"
            new="${new//economysmp/novacore}"
            if [ "$file" != "$new" ] && [ -e "$file" ]; then
              mkdir -p "$(dirname "$new")"
              git mv "$file" "$new"
            fi
          done < <(git ls-files -z)

          git rm .github/workflows/one-time-novacore-rename.yml
          if ! git diff --cached --quiet || ! git diff --quiet; then
            git add -A
            git commit -m "Rename all EconomySMP branding to NovaCore"
            git push
          fi
