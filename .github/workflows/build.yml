name: Auto Build

# Builds EconomySMP.jar on every push to main and keeps a rolling pre-release (v<version>-pre)
# up to date with it. The in-game updater (update.yml, release-tag: "auto") reads that release.

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

# Two pushes landing close together would race for the nightly tag. Cancelling the older run leaves
# the newest commit on main as the only one that reaches the tag and release steps.
concurrency:
  group: build-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Unit tests run in the Pull Request Verification workflow; this one only has to produce the jar.
      - name: Build Jar
        run: mvn -B clean package -DskipTests

      - name: Get Project Version
        id: metadata
        run: |
          VERSION=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v7
        with:
          name: EconomySMP-${{ steps.metadata.outputs.version }}
          path: target/EconomySMP.jar
          if-no-files-found: error

      - name: Update Nightly Tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag -f "v${{ steps.metadata.outputs.version }}-pre"
          git push -f origin "v${{ steps.metadata.outputs.version }}-pre"

      - name: Publish Nightly Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.metadata.outputs.version }}-pre"
          name: "EconomySMP v${{ steps.metadata.outputs.version }}-pre (nightly)"
          body: |
            ### EconomySMP v${{ steps.metadata.outputs.version }}-pre
            Automated pre-release build, updated in place on every push to `main`.

            - **Commit:** ${{ github.sha }}
            - **Build:** #${{ github.run_number }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: target/EconomySMP.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
