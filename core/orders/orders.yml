  ALLOWED:
    - MOST_PAID
    - MOST_DELIVERED
    - RECENTLY_LISTED
    - MOST_MONEY_PER_ITEM

DONUT-STYLE: DEPOSIT_GUI

BEDROCK:
  ENABLED: true

NETWORK:
  ENABLED: true
  REDIS_CHANNEL: economysmp:orders

SEARCH_SIGN:
  lines:
    - ""
    - "^^^^^^^^^^^^^^"
    - "Search"
    - ""
  input-line: 0

AMOUNT_SIGN:
  lines:
    - ""
    - "^^^^^^^^^^^^^^"
    - "Amount"
    - ""
  input-line: 0

PRICE_SIGN:
  lines:
    - ""
    - "^^^^^^^^^^^^^^"
    - "Price"
    - ""
  input-line: 0

BOTS:
  ENABLED: false
  MIN_CHECK_INTERVAL_SECONDS: 60
  MAX_CHECK_INTERVAL_SECONDS: 300
  CHANCE: 0.5
  MAX_ACTIVE_BOT_ORDERS: 10
  MIN_DURATION_HOURS: 24
  MAX_DURATION_HOURS: 72
  BOT_NAMES:
    - "OrderBot"
    - "BuyerBot"
    - "ItemCollector"
  ITEMS:
    - MATERIAL: DIAMOND
      MIN_AMOUNT: 16
      MAX_AMOUNT: 64
      MIN_PRICE_EACH: 500
      MAX_PRICE_EACH: 1000
    - MATERIAL: OAK_LOG
      MIN_AMOUNT: 64
      MAX_AMOUNT: 512
      MIN_PRICE_EACH: 10
      MAX_PRICE_EACH: 25
    - MATERIAL: NETHERITE_INGOT
      MIN_AMOUNT: 1
      MAX_AMOUNT: 4
      MIN_PRICE_EACH: 25000
      MAX_PRICE_EACH: 50000

SERVER-NOTIFICATIONS:
    ORDERS:
      ENABLED: true
      CREATE:
        ENABLED: false
        MESSAGE: '&8[&6ORDER&8] &f{player} &7created an order for &e{amount}x {item} &7at &a{price_formatted} &7each.'
      COMPLETE:
        ENABLED: false
        MESSAGE: '&8[&6ORDER&8] &f{player} &7completed &e{owner}&7''s order for &e{amount}x {item}&7.'

