# turn the whitelist on/off
whitelist:
  enabled: true

# stuff that happens when a cmd is blocked
feedback:
  message: "&cThis command is not available."
  chat: true
  action-bar: true
  sound:
    enabled: true
    type: ENTITY_VILLAGER_NO

