# Setting toggle cooldown
cooldown:
  enabled: true
  duration: 3
  message: "&#FF9600Please wait %time% seconds before changing settings again!"

# Toggle status labels
toggle:
  enabled: "&a&lON"
  disabled: "&c&lOFF"

# Visibility setting only works in specified worlds/regions
# If regions are specified, they take priority over worlds
player-visibility:
  worlds:
    - Spawn 
    - AFK
  # WorldGuard regions where player visibility setting applies
  # Leave empty to use world-based check instead
  regions:
    - spawn
    - hub


