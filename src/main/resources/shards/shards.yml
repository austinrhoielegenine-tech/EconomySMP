shards-per-minute: 1 # Shards given each reward tick while in AFK region
reward-interval-seconds: 60 # How often rewards are given (seconds)

enabled-worlds: # Empty list = all worlds. Add names to limit (e.g. AFK, world)
  - AFK

enabled-regions: # WorldGuard region ids (case-insensitive)
  - afk-zone

vip:
  enabled: true
  shards-per-minute: 2 # Rate in AFK zone for novacore.system.shards.vip

pay-enabled: true # Allow /shards pay <player> <amount>

sounds:
  afk-enter: ENTITY_PLAYER_LEVELUP
  reward: ENTITY_EXPERIENCE_ORB_PICKUP
  click-sound: UI_BUTTON_CLICK
  plugin-reloaded: ENTITY_PLAYER_LEVELUP

# Amethyst shard booster (shift + right-click glass bottle)
# Timer runs even offline / outside AFK. Speed only applies while AFKing.
shard-booster:
  duration-hours: 24
  speed-multiplier: 4.0
  activate-sound: BLOCK_BEACON_ACTIVATE
  activate-volume: 1.0
  activate-pitch: 1.2
