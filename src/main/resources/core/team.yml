enable: true

TEAM:
  NAME-MIN-LENGTH: 3
  NAME-MAX-LENGTH: 5
  LIMIT-MEMBERS: 10
  EXCLUDED-WORLDS: []

MENUS:
  TEAM-MENUS:
    TEAM:
      TITLE: '&8Team'
      SIZE: 54
      MAX-ITEMS-PER-PAGE: 45
      PLAYER-BUTTON:
        ONLINE-SYMBOL: "&a■"
        OFFLINE-SYMBOL: "&4■"
        LORE: '&fClick to edit'
      SEARCH-BUTTON:
        TITLE: '&#6BF18DSearch'
        MATERIAL: OAK_SIGN
        SLOT: 45
        LORE:
        - '&fSearch for team members'
      SEARCH_SIGN:
        lines:
        - ''
        - ↑↑↑↑↑↑↑↑↑↑↑↑↑
        - Search
        - ''
        input-line: 0
      SORT-BUTTON:
        TITLE: '&aSort'
        MATERIAL: HOPPER
        SLOT: 46
        SELECTED-PREFIX: '&a'
        UNSELECTED-PREFIX: '&f'
        SYMBOL: "▪"
      REFRESH-BUTTON:
        TITLE: '&#6BF18DTeam {team_name}'
        MATERIAL: IRON_HELMET
        SLOT: 49
        LORE:
        - '&fClick to refresh'
        - '&7Add up to {max_members} members'
      HOME-BUTTON:
        TITLE: '&#6BF18DTeam Home'
        MATERIAL: WHITE_BANNER
        SLOT: 52
        HOME-LORE: '&fClick to teleport to your team''s home'
        NO-HOME-LORE: '&fSet the team home with /home'
      PVP-BUTTON:
        TITLE: '&#6BF18DPVP'
        MATERIAL: IRON_SWORD
        SLOT: 53
        ON-STATE: '&a&lON'
        OFF-STATE: '&c&lOFF'
        LORE: '&fCurrently: {state}'
      MESSAGES:
        NOT-IN-TEAM: '&cYou are not part of the team.'
        NO-PERMISSION: '&cYou don''t have permissions to do this.'
        CANT-EDIT-SELF: '&cYou can''t do this yourself!'
    TEAM-INFO:
      TITLE: '&8Team {team_name}'
      SIZE: 54
      MAX-ITEMS-PER-PAGE: 45
      PLAYER-BUTTON:
        ONLINE-SYMBOL: "&a■"
        OFFLINE-SYMBOL: "&4■"
        LEADER-LORE: '&6Leader'
      SUMMARY-BUTTON:
        TITLE: '&#6BF18DTeam {team_name}'
        MATERIAL: IRON_HELMET
        SLOT: 49
        ON-STATE: '&a&lON'
        OFF-STATE: '&c&lOFF'
        LORE:
        - '&7Leader: &f{leader}'
        - '&7Members: &f{members}&7/&f{max_members}'
        - '&7PvP: {state}'
      PAGE-BUTTON:
        TITLE: '&fPage {page}&7/&f{total_pages}'
        MATERIAL: PAPER
        SLOT: 50
        LORE:
        - '&7Browse team members.'
    TEAM-EDIT-MEMBER:
      TITLE: '&8Edit {player}'
      SIZE: 27
      PLACEHOLDER: false
      PLACEHOLDER-MATERIAL: AIR
      EDIT-HOME-BUTTON:
        TITLE: '&#6BF18DEdit Home'
        MATERIAL: WHITE_BANNER
        SLOT: 10
        ON-STATE: '&a&lON'
        OFF-STATE: '&c&lOFF'
        LORE:
        - '&fLet {player} set and remove the team home'
        - '&fCurrently: {state}'
      KICK-BUTTON:
        TITLE: '&#6BF18DKick'
        MATERIAL: OAK_DOOR
        SLOT: 11
        LORE:
        - '&fClick to kick {player}'
      MANAGE-TEAMMATES-BUTTON:
        TITLE: '&#6BF18DManage Teammates'
        MATERIAL: IRON_HELMET
        SLOT: 12
        ON-STATE: '&a&lON'
        OFF-STATE: '&c&lOFF'
        LORE:
        - '&fLet {player} invite and kick teammates'
        - '&fCurrently: {state}'
      PVP-BUTTON:
        TITLE: '&#6BF18DPVP'
        MATERIAL: IRON_SWORD
        SLOT: 13
        ON-STATE: '&a&lON'
        OFF-STATE: '&c&lOFF'
        LORE:
        - '&fLet {player} turn on and off team pvp'
        - '&fCurrently: {state}'
      VISIT-HOME-BUTTON:
        TITLE: '&#6BF18DVisit Team Home'
        MATERIAL: ENDER_PEARL
        SLOT: 14
        ON-STATE: '&a&lON'
        OFF-STATE: '&c&lOFF'
        LORE:
        - '&fLet {player} go to team home'
        - '&fCurrently: {state}'
      TEAM-CHAT-BUTTON:
        TITLE: '&#6BF18DTeam Chat'
        MATERIAL: FEATHER
        SLOT: 15
        ON-STATE: '&a&lON'
        OFF-STATE: '&c&lOFF'
        LORE:
        - '&fLet {player} speak in chat'
        - '&fCurrently: {state}'
      BACK-BUTTON:
        TITLE: '&cBack'
        MATERIAL: BARRIER
        SLOT: 18
        LORE:
        - '&fClick to return'
    TEAM-KICK-MEMBER:
      PLACEHOLDER: true
      TITLE: '&8Confirm Kicking {player}'
      SIZE: 27
      CANCEL-BUTTON:
        TITLE: '&#FC0000Cancel'
        MATERIAL: BARRIER
        SLOT: 11
        LORE:
        - '&fClick to cancel'
      CONFIRM-BUTTON:
        TITLE: '&#00FC00Confirm'
        MATERIAL: EMERALD
        SLOT: 15
        LORE:
        - '&fClick to kick {player}'
    TEAM-DISBAND:
      PLACEHOLDER: true
      TITLE: '&8Confirm Disbanding Team'
      SIZE: 27
      CANCEL-BUTTON:
        TITLE: '&#FC0000Cancel'
        MATERIAL: BARRIER
        SLOT: 11
        LORE:
        - '&fClick to cancel'
      CONFIRM-BUTTON:
        TITLE: '&#00FC00Confirm'
        MATERIAL: EMERALD
        SLOT: 15
        LORE:
        - '&fClick to confirm'

MESSAGES:
  TEAM:
    NO-TEAM: '&cYou don''t have a team. Type /team create (name) to create a team.'
    ALREADY-EXISTS: '&cYou cannot create a team with this name, it is already taken.'
    TEAM-CREATED: '&aTeam created.'
    TEAM-DISBANDED: '&7Team disbanded.'
    ALREADY-IN-TEAM: '&cYou are already in a team.'
    NOT-LEADER: '&cYou are not the leader.'
    PLAYER-NO-INVITES: '&cThis player does not accept invitations.'
    PLAYER-IN-TEAM: '&c{player} is already in a team.'
    TEAM-FULL: '&cTeam has reached the maximum members.'
    INVITE-SENT: '&eYou have invited &a{player} &eto join the team.'
    NO-PENDING-INVITES: '&cYou have no pending invites for &6{team}&c.'
    JOIN-SUCCESS: '&aYou have joined to &e{team}&a.'
    CANNOT-INVITE-YOURSELF: '&cYou cannot invite yourself!'
    CANT-KICK-SELF: '&cYou cannot kick yourself!'
    KICK-SUCCESS: '&aSuccessfully kicked &7({player}).'
    KICKED-FROM-TEAM: '&aYou have been kicked from the team.'
    PLAYER-NOT-IN-TEAM: '&c{player} is not a member of your team.'
    TEAM-CHAT-ENABLED: '&7You enabled team chat.'
    TEAM-CHAT-DISABLED: '&7You disabled team chat.'
    NO-MANAGE-PERMISSION: '&cYou don''t have permission to invite or kick teammates.'
    NO-EDIT-HOME-PERMISSION: '&cYou don''t have permission to edit the team home.'
    NO-VISIT-HOME-PERMISSION: '&cYou don''t have permission to visit the team home.'
    NO-TEAM-CHAT-PERMISSION: '&cYou don''t have permission to use team chat.'
    NO-PVP-PERMISSION: '&cYou don''t have permission to change team PvP.'
    TEAM-PVP-ENABLED: '&7Team PvP is now &aenabled&7.'
    TEAM-PVP-DISABLED: '&7Team PvP is now &cdisabled&7.'
    NO-TEAM-HOME: '&7Your team does not have a home.'
    TEAM-HOME-DELETED: '&7Team home deleted.'
    TEAM-HOME-SET: '&7Team home set'
    EXCLUDED-WORLD: '&cYou cannot set a team home in this world.'
    TEAM-NOT-EXIST: '&cUser/team does not exist.'
    INVITED-TO-JOIN: '&7You have been invited to join the &a{team}&7 team!'
    CLICK-TO-JOIN: '&b[Click to join]'
    HOVER-JOIN: '&eClick to join the {team} team.'
    OR-TYPE-COMMAND: '&7or type &f{command}&7 to join.'
    JOINED-BROADCAST: '&a{player} &ehas joined the team.'
