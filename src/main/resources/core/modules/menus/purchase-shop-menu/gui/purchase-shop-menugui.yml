enable: true
PURCHASE-SHOP-MENU:
  TITLE: '&8Confirmation Menu'
  SIZE: 27
  BUTTONS:
    MAIN:
      SLOT: 13
      LORE:
        MONEY: '&fBUY PRICE: &a${price}'
        SHARD: '&fBUY PRICE: &5${price}X &lShards'
        DEFAULT: '&fBUY PRICE: &a${price}'
    CANCEL:
      SLOT: 21
      MATERIAL: BARRIER
      NAME: '&cCancel'
      LORE: '&fCLICK TO CANCEL'
    CONFIRM:
      SLOT: 23
      MATERIAL: EMERALD
      NAME: '&aConfirm'
      LORE: '&fCLICK TO BUY'
    QUANTITY_ADJUST:
      ADD:
        MATERIAL: EMERALD
        ADD_1:
          SLOT: 15
          NAME: '&aAdd 1'
          INCREMENT: 1
        ADD_10:
          SLOT: 16
          NAME: '&aAdd 10'
          INCREMENT: 10
        SET_64:
          SLOT: 17
          NAME: '&aSet To 64'
          INCREMENT: 64
      REMOVE:
        MATERIAL: BARRIER
        REMOVE_1:
          SLOT: 11
          NAME: '&cRemove 1'
          DECREMENT: 1
        REMOVE_10:
          SLOT: 10
          NAME: '&cRemove 10'
          DECREMENT: 10
        REMOVE_64:
          SLOT: 9
          NAME: '&cRemove 64'
          DECREMENT: 64
  RESTRICTIONS:
    TOTEM_OF_UNDYING:
      MAX_QUANTITY: 1
      MIN_QUANTITY: 1
      HIDE_QUANTITY_BUTTONS: true
    ENDER_PEARL:
      MAX_QUANTITY: 16
      MIN_QUANTITY: 1
    DEFAULT:
      MAX_QUANTITY: 64
      MIN_QUANTITY: 1
  MESSAGES:
    SUCCESS:
      MONEY: '&7You bought &e{Quantity} {item-name}&7 for &a${amount}'
      SHARDS: '&7You bought {item-name}&7 for &5{amount} shards'
    ERROR:
      NO_MONEY: '&cYOU DON''T HAVE ENOUGH MONEY.'
      NO_SHARDS: '&cYOU DON''T HAVE ENOUGH SHARDS.'
      FULL_INVENTORY: '&cYOUR INVENTORY IS FULL.'
  SOUNDS:
    SUCCESS: ENTITY_EXPERIENCE_ORB_PICKUP
    ERROR: ENTITY_VILLAGER_NO
