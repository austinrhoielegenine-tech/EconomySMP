enabled: false
auto-start: true
interval-minutes: 12
answer-time-seconds: 15

messages:
  start-reaction: "&7Hover & type the text first to win!"
  start-math: "&7Hover & solve the equation first to win!"
  start-unscramble: "&7Unscramble the word first to win!"
  start-trivia: "&7Answer the trivia first to win!"
  start-reverse: "&7Type the word backwards first to win!"
  start-sequence: "&7Type the missing number first to win!"
  start-color: "&7Type the color name first to win!"
  start-typo: "&7Fix the typo first to win!"
  winner: "&#00fc88%player% &7won in &#00fc88%time%s&7! Answer: &#00fc88%answer%"
  nobody: "&cNobody answered in time. Next game soon!"
  already-running: "&cA chat game is already running."
  forced: "&aForced a new chat game."
  disabled: "&cChat games are disabled."
  enabled-msg: "&aChat games enabled."
  stopped: "&cChat games stopped."

games:
  reaction:
    enabled: true
    min-length: 4
    max-length: 8
  math:
    enabled: true
    sum-min: 1
    sum-max: 250
    sub-min: 1
    sub-max: 250
    mult-min: 2
    mult-max: 12
    div-min: 2
    div-max: 12
  unscramble:
    enabled: true
    words:
      - diamond
      - netherite
      - emerald
      - redstone
      - enderman
      - creeper
      - skeleton
      - village
      - ancient
      - dragon
      - elytra
      - beacon
      - shulker
      - trident
      - phantom
      - warden
      - sculk
      - copper
      - amethyst
      - bamboo
  trivia:
    enabled: true
    questions:
      - question: "What ore is needed for a beacon?"
        answer: "nether star"
      - question: "How many eyes to activate an end portal?"
        answer: "12"
      - question: "What mob drops a totem?"
        answer: "evoker"
      - question: "What dimension has the end city?"
        answer: "the end"
      - question: "What block powers a redstone lamp?"
        answer: "redstone"
      - question: "Max vanilla stack size for most items?"
        answer: "64"
      - question: "What tool mines obsidian?"
        answer: "diamond pickaxe"
      - question: "What do you need to craft an eye of ender?"
        answer: "ender pearl"
  reverse:
    enabled: true
    words:
      - minecraft
      - survival
      - diamond
      - nether
      - dragon
      - elytra
      - beacon
      - portal
  sequence:
    enabled: true
  color:
    enabled: true
    colors:
      red: "red"
      blue: "blue"
      green: "green"
      yellow: "yellow"
      lime: "lime"
      aqua: "aqua"
      gold: "gold"
      purple: "purple"
  typo:
    enabled: true
    pairs:
      - broken: "diamnod"
        answer: "diamond"
      - broken: "emrald"
        answer: "emerald"
      - broken: "nethrite"
        answer: "netherite"
      - broken: "crepeer"
        answer: "creeper"
      - broken: "endrman"
        answer: "enderman"

rewards:
  - chance: 40
    type: command
    command: "give %player% diamond 8"
  - chance: 25
    type: command
    command: "give %player% gold_ingot 16"
  - chance: 15
    type: command
    command: "give %player% netherite_ingot 1"
  - chance: 8
    type: command
    command: "give %player% netherite_sword 1"
  - chance: 5
    type: command
    command: "give %player% netherite_pickaxe 1"
  - chance: 4
    type: command
    command: "give %player% netherite_chestplate 1"
  - chance: 20
    type: money
    amount: 500
  - chance: 10
    type: money
    amount: 2500
  - chance: 5
    type: money
    amount: 10000
  - chance: 8
    type: command
    command: "eco give %player% 1000"
  - chance: 6
    type: command
    command: "give %player% enchanted_golden_apple 1"
  - chance: 5
    type: command
    command: "give %player% elytra 1"
