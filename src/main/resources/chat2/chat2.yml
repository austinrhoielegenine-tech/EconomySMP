modules:
  chat-security: true
spam:
  cooldown-seconds: 3
  blacklist: true
  advertising: true
  caps: true
  chat-format: true
  hover-chat: true

chat-format:
  format: '%luckperms_prefix%%player%: %message%'

  caps:  
    minimum-message-length: 8   
    max-uppercase-percent: 70 
  blacklist: 
    words:
    - badword
    - test
  advertising:  
    block-ips: true
    block-discord-invites: true
hover:
  enabled: true
  text:
    - "&7%luckperms_prefix%%player%"
    - "&7&m----------"
    - "#00FC00&l$ &fMoney #00FC00%economysmpcore_pay_balance%"
    - "#A303F9★ &fShards #A303F9%economysmpcore_shards_balance%"
    - "#FC0000🗡 &fKills #FC0000%economysmpcore_stats_kills%"
    - "#FCE300⌚ &fPlaytime #FCE300%economysmpcore_stats_playtime%"
    - "#F97603☠ &fDeaths #F97603%economysmpcore_stats_deaths%"
    - "&7&m----------"
    - "&7Click to view stats"
  click-command: "/stats %player%"

chat-toggle:
  disabled: false # Change to True to disable global Chat
messages: 
  reload-success: '&aEconomyChat has been reloaded successfully!'
  no-permission: '&cYou don''t have permission.'
  chat-disabled: '&cGlobal chat is currently disabled.' 
  blacklisted: '&cYour message was blocked because it contains a blacklisted word.'
  spam: '&cPlease slow down.'  
  advertising: '&cAdvertising is not allowed.'  
  caps: '&cPlease don''t use excessive caps.'
effects:
  enabled: true
  sound: ENTITY_VILLAGER_NO
  title: ''
  subtitle: ''

advertising-patterns:
  - "(?i)\\b\\d{1,3}(\\.\\d{1,3}){3}(:\\d{1,5})?\\b"
  - "(?i)\\b[a-z0-9-]+\\.(com|net|org|gg|xyz|io|me|tk|ml|ga|cf|shop|store|mc)\\b"
  - "(?i)discord\\.gg/[a-z0-9-]+"
  - "(?i)discord\\.com/invite/[a-z0-9-]+"
  - "(?i)\\bjoin\\s+(my|our)\\s+(server|realm)\\b"
