preset-change-interval: 48h # How often the active trade preset rotates (12h, 30m, 1d)
cooldown: 0 # Seconds between trades per player

presets:
  1:
    trade-item: PISTON
    amount: 64
    required-items:
      - 1 NETHERITE_INGOT
  2:
    trade-item: OBSIDIAN
    amount: 32
    required-items:
      - 16 DIAMOND
  3:
    trade-item: GOLDEN_APPLE
    amount: 8
    required-items:
      - 32 GOLD_INGOT

sounds:
  click:
    sound: UI_BUTTON_CLICK
  reload:
    sound: BLOCK_NOTE_BLOCK_PLING
  trade-success:
    sound: ENTITY_PLAYER_LEVELUP
  error:
    sound: ENTITY_VILLAGER_NO
